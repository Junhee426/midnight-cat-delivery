name: Web build & GitHub Pages

# Builds and tests the Godot Web export, and deploys it to GitHub Pages.
# Pull requests into main run the same build + tests but never deploy; the deploy job
# runs only for pushes to main (or a manual run on main), after every test passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; each pull request gets its own group so PR checks never queue behind it.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match the engine the project is made with and the export templates.
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot and Web export templates
        id: godot-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-web-templates

      - name: Install Godot ${{ env.GODOT_VERSION }} and Web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Only the single-threaded Web templates are needed.
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_*' 'templates/version.txt' -d "$tpl"
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"

      - name: Check engine and template versions match
        run: |
          set -euo pipefail
          ~/godot/godot --headless --version | tee /dev/stderr | grep -q "^${GODOT_VERSION}.stable"
          test "$(cat ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt)" = "${GODOT_VERSION}.stable"

      - name: Import, smoke test, Web export and export checks
        run: GODOT="$HOME/godot/godot" tools/build_web.sh

      - name: Install Playwright Chromium (test tool only, not part of the game)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Real-browser tests (start, keyboard/mouse, multitouch, errors)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          # A manual run also plays the whole delivery route (slow on CPU-rendered WebGL).
          ONLY: ${{ github.event_name == 'workflow_dispatch' && 'desktop route mobile errors' || 'desktop mobile errors' }}
        run: |
          set -euo pipefail
          python3 tools/serve_web.py --port 8060 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8060/midnight-cat-delivery/ && break
            sleep 1
          done
          node tools/browser_test.cjs http://localhost:8060/midnight-cat-delivery/ builds/qa

      - name: Upload browser test screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa
          path: builds/qa
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: builds/web

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show the deployed URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
